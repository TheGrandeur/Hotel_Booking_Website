#spring
#.application.name=HotelService

server: 
   port: 8081
   
spring:
   datasource:
      url: jdbc:mysql://localhost:3306/microservices
      username: root
      password: root@$00
   jpa:
     hibernate: 
        ddl-auto: update
     show-sql: true 
   application: 
      name: UserService
   cloud:
     config:
       enabled: false

eureka:
    instance:
        prefer-ip-address: true
    client:
        fetch-registry: true
        register-with-eureka: true
        service-url:
            defaultZone: http://localhost:8002/eureka